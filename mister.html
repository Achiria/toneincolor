<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tone in Color</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- lightGallery -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/css/lightgallery-bundle.min.css" />

  <style>
    /* ── Design tokens ── */
    :root {
      --bg:         #0a0a0b;
      --surface:    #111114;
      --border:     rgba(255,255,255,0.06);
      --text:       #e8e4dc;
      --muted:      rgba(232, 228, 220, 0.38);
      --accent:     #c9a96e;
      --accent-dim: rgba(201, 169, 110, 0.15);
      --grain-opacity: 0.045;
      --header-h:   68px;

      /* Override Bootstrap colour scheme */
      --bs-body-bg:    #0a0a0b;
      --bs-body-color: #e8e4dc;
      --bs-border-color: rgba(255,255,255,0.06);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
      /* cursor: crosshair; */
    }

    /* Film-grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: var(--grain-opacity);
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Navbar overrides ── */
    .navbar {
      min-height: var(--header-h);
      background: rgba(10, 10, 11, 0.82) !important;
      backdrop-filter: blur(18px) saturate(0.8);
      -webkit-backdrop-filter: blur(18px) saturate(0.8);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
    }

    .navbar-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 3.5vw, 1.55rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      color: var(--text) !important;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .navbar-brand span { color: var(--accent); font-style: italic; }

    .navbar-nav .nav-link {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted) !important;
      transition: color 0.3s;
      white-space: nowrap;
      padding: 0 0 0 20px;
    }
    .navbar-nav .nav-link:hover { color: var(--accent) !important; }

    /* Hamburger */
    .navbar-toggler { border-color: var(--border); }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28232,228,220,0.5%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }
    .navbar-toggler:focus { box-shadow: 0 0 0 2px var(--accent-dim); }

    /* Collapsed menu backdrop */
    .navbar-collapse { background: rgba(10,10,11,0.97); padding: 8px 0; }
    @media (min-width: 576px) { .navbar-collapse { background: transparent; padding: 0; } }

    .photo-count {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      white-space: nowrap;
    }
    @media (max-width: 575px) { .photo-count { display: none !important; } }

    /* ── Hero ── */
    .hero {
      margin-top: var(--header-h);
      padding: clamp(40px, 10vw, 100px) 40px 60px;
      position: relative;
    }

    .hero-label {
      font-size: 1rem;
      letter-spacing: 0.8em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.8s 0.1s forwards;
    }

    .hero-title {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: 10px;
      color: var(--text);
      margin: 0;
      opacity: 0;
      animation: fadeUp 0.9s 0.25s forwards;
    }
    .hero h1 em {
      font-style: italic;
      color: var(--accent);
      text-shadow: #ffcc00 2px 0 10px;
      letter-spacing: 0;
    }

    .hero-in {
      font-family: "Fleur De Leah", cursive;
      font-weight: 400;
      font-style: normal;
      font-size: clamp(3.5rem, 10vw, 7rem);
      color: var(--muted);
      line-height: 0.85;
      margin-left: 0.1em;
      opacity: 0;
      animation: fadeUp 0.85s 0.18s forwards;
    }

    .hero-line {
      width: 60px;
      height: 1px;
      background: var(--accent);
      margin: 36px 0;
      opacity: 0;
      animation: fadeUp 0.8s 0.4s forwards;
    }

    .hero-sub {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.8;
      opacity: 0;
      animation: fadeUp 0.8s 0.5s forwards;
      margin: 0;
    }

    /* ── Gallery ── */
    #gallery { padding: 20px 40px 80px; }

    .filter-btn {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 18px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* Masonry — CSS columns (Bootstrap grid is fixed-width, not masonry) */
    .photo-grid { columns: 3; column-gap: 20px; }
    @media (max-width: 900px) { .photo-grid { columns: 2; } }
    @media (max-width: 576px)  { .photo-grid { columns: 1; } }

    .grid-item {
      break-inside: avoid;
      padding-bottom: 20px;
      position: relative;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s forwards;
      display: block;
      text-decoration: none;
    }
    .grid-item:nth-child(1)    { animation-delay: 0.05s; }
    .grid-item:nth-child(2)    { animation-delay: 0.10s; }
    .grid-item:nth-child(3)    { animation-delay: 0.15s; }
    .grid-item:nth-child(4)    { animation-delay: 0.20s; }
    .grid-item:nth-child(5)    { animation-delay: 0.25s; }
    .grid-item:nth-child(6)    { animation-delay: 0.30s; }
    .grid-item:nth-child(7)    { animation-delay: 0.35s; }
    .grid-item:nth-child(8)    { animation-delay: 0.40s; }
    .grid-item:nth-child(9)    { animation-delay: 0.45s; }
    .grid-item:nth-child(n+10) { animation-delay: 0.50s; }

    .grid-item-inner {
      position: relative;
      overflow: hidden;
      background: var(--surface);
    }

    .grid-item-inner img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.5s ease;
      /* filter: brightness(0.88) contrast(1.05) saturate(0.85); */
    }
    .grid-item:hover .grid-item-inner img {
      transform: scale(1.04);
      /* filter: brightness(1.02) contrast(1.02) saturate(1.05); */
    }

    .grid-item-inner .overlay {
      position: absolute;
      inset: 0;
      opacity: 0;
      font-size: 1.25rem;
      text-shadow: #ffcc00 2px 0 10px;
      color: white;
      transition: opacity 0.4s;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }
    .grid-item:hover .grid-item-inner .overlay { opacity: 1; }

    .overlay-meta {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
    }
    .overlay-meta strong {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #fff;
      margin-bottom: 2px;
      font-style: italic;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, rgba(255,255,255,0.04) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      break-inside: avoid;
      margin-bottom: 20px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .state-message {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      column-span: all;
    }
    .state-message .icon { font-size: 2.5rem; margin-bottom: 20px; opacity: 0.4; }
    .state-message h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      color: var(--text);
      margin-bottom: 12px;
    }
    .state-message p {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      line-height: 1.9;
      max-width: 460px;
      margin: 0 auto 10px;
    }
    .state-message code {
      font-family: 'Courier New', monospace;
      font-size: 0.68rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 2px 8px;
    }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 40px;
    }
    .footer-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--muted);
    }
    .footer-copy {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
    .footer-links a {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--accent); }

    @media (max-width: 992px) {
      .hero-label { letter-spacing: 0.4em; font-size: 0.85rem; }
    }

    @media (max-width: 768px) {
      /* #gallery { padding: 20px 16px 60px; }
      .hero { padding: 40px 20px 40px; }
      .hero h1 { letter-spacing: 4px; } */
      .hero-label { letter-spacing: 0.35em; font-size: 0.8rem; }
      /* .filter-btn { font-size: 1.2rem; padding: 6px 14px; } */
    }

    @media (max-width: 576px) {
      #gallery { padding: 20px 16px 60px; }
      .hero { padding: 40px 20px 40px; }
      .hero h1 { letter-spacing: 4px; }
      .hero-label { letter-spacing: 0.3em; font-size: 0.75rem; }
      .filter-btn { font-size: 1.2rem; padding: 6px 14px; }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── lightGallery theme overrides ── */
    .lg-backdrop { background: #0a0a0b; }

    .lg-toolbar,
    .lg-actions .lg-prev,
    .lg-actions .lg-next,
    .lg-sub-html { background: transparent; }

    .lg-actions .lg-prev,
    .lg-actions .lg-next {
      border: 1px solid rgba(255,255,255,0.06);
      color: rgba(232,228,220,0.38);
      border-radius: 0;
      font-size: 1.1rem;
      padding: 14px 18px;
      transition: border-color 0.2s, color 0.2s;
    }
    .lg-actions .lg-prev:hover,
    .lg-actions .lg-next:hover {
      border-color: #c9a96e;
      color: #c9a96e;
      background: rgba(201,169,110,0.08);
    }

    .lg-toolbar .lg-close { color: rgba(232,228,220,0.38); transition: color 0.2s; }
    .lg-toolbar .lg-close:hover { color: #c9a96e; }

    .lg-sub-html {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.45);
      padding: 16px;
    }

    .lg-toolbar .lg-icon { color: rgba(232,228,220,0.38); transition: color 0.2s; }
    .lg-toolbar .lg-icon:hover { color: #c9a96e; }

    .lg-counter {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: rgba(232,228,220,0.38);
    }

    .lg-thumb-outer { background: rgba(10,10,11,0.92); border-top: 1px solid rgba(255,255,255,0.06); }
    .lg-thumb-item.active, .lg-thumb-item:hover { border-color: #c9a96e; }
  </style>
</head>
<body>

  <!-- ── Navbar (Bootstrap) ── -->
  <nav class="navbar navbar-expand-sm fixed-top">
    <div class="container-fluid px-0">
      <a class="navbar-brand ms-3" href="../">tone / <span>color</span></a>

      <button class="navbar-toggler me-3" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMenu"
              aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-sm-center">
          <li class="nav-item"><a class="nav-link" href="#gallery">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="/projects">Projects</a></li>
        </ul>
        <span class="photo-count ms-3 me-3" id="photo-count">— photos</span>
      </div>
    </div>
  </nav>

  <!-- ── Hero ── -->
  <section class="hero">
    <div class="hero-label">anthony gamboa</div>
    <div class="hero-title">
      <h1>TONE</h1>
      <!-- <h3 class="hero-in">in</h3> -->
      <h1><em>COLOR</em></h1>
    </div>
    <div class="hero-line"></div>
    <p class="hero-sub">photographs of birds, beasts, and sundry milieu.</p>
    <p class="hero-sub">member of the managerie of lovely things</p>
  </section>

  <!-- ── Gallery ── -->
  <section id="gallery">
    <div class="d-flex align-items-center flex-wrap gap-2 mb-4" id="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="applyFilter('all')">Mister Man</button>
    </div>
    <div class="photo-grid" id="grid">
      <div class="skeleton" style="height:280px"></div>
      <div class="skeleton" style="height:380px"></div>
      <div class="skeleton" style="height:220px"></div>
      <div class="skeleton" style="height:340px"></div>
      <div class="skeleton" style="height:260px"></div>
      <div class="skeleton" style="height:420px"></div>
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer class="site-footer" id="about">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
      <div class="footer-logo">TONE IN COLOR</div>
      <div class="footer-copy">&copy; <span id="yr"></span> — All rights reserved</div>
      <div class="footer-links"><a href="#gallery">Back to top</a></div>
    </div>
  </footer>

  <!-- Bootstrap 5 JS bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- lightGallery + plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/lightgallery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/plugins/zoom/lg-zoom.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/plugins/thumbnail/lg-thumbnail.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/plugins/fullscreen/lg-fullscreen.min.js"></script>

  <script>
    const PROXY = './mister.php';

    let photos     = [];
    let lgInstance = null;

    // ── Fetch ─────────────────────────────────────────────────
    async function fetchPhotos() {
      const res  = await fetch(PROXY);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Could not load photos');
      return json.data?.list || [];
    }

    // ── Fisher-Yates shuffle ──────────────────────────────────
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ── Filter buttons ────────────────────────────────────────
    function buildFilters(list) {
      const allTags = new Set(list.flatMap(p => p.tags || []));
      if (!allTags.size) return;
      const bar = document.getElementById('filter-bar');
      [...allTags].sort().forEach(tag => {
        const btn = document.createElement('button');
        btn.className      = 'filter-btn';
        btn.dataset.filter = tag;
        btn.textContent    = tag.charAt(0).toUpperCase() + tag.slice(1);
        btn.addEventListener('click', () => applyFilter(tag));
        bar.appendChild(btn);
      });
    }

    function applyFilter(tag) {
      document.querySelectorAll('.filter-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.filter === tag)
      );
      const filtered = tag === 'all'
        ? photos
        : photos.filter(p => (p.tags || []).includes(tag));
      renderPhotos(filtered);
    }

    // ── Render grid + init lightGallery ───────────────────────
    function renderPhotos(list) {
      const grid = document.getElementById('grid');

      if (lgInstance) { lgInstance.destroy(); lgInstance = null; }
      grid.innerHTML = '';

      if (!list.length) {
        grid.innerHTML = `<div class="state-message">
          <div class="icon">◻</div>
          <h2>No photos found</h2>
          <p>Upload images to the <code>/photos</code> folder on your server.</p>
        </div>`;
        return;
      }

      list.forEach(photo => {
        const a = document.createElement('a');
        a.href            = photo.full;
        a.dataset.src     = photo.full;
        a.dataset.thumb   = photo.thumb;
        a.dataset.subHtml = `<p>${photo.caption}</p>`;
        a.className       = 'grid-item';

        a.innerHTML = `
          <div class="grid-item-inner">
            <img src="${photo.thumb}" alt="${photo.caption}" loading="lazy" />
            <div class="overlay">
              <div class="overlay-meta">
                <strong>${photo.caption}</strong>
              </div>
            </div>
          </div>`;

        grid.appendChild(a);
      });

      lgInstance = lightGallery(grid, {
        selector:             'a.grid-item',
        plugins:              [lgZoom, lgThumbnail, lgFullscreen],
        speed:                400,
        download:             false,
        counter:              true,
        escKey:               true,
        keyPress:             true,
        hideScrollbar:        true,
        zoom:                 true,
        actualSize:           false,
        showZoomInOutIcons:   true,
        thumbnail:            true,
        animateThumb:         true,
        currentPagerPosition: 'middle',
        thumbWidth:           80,
        thumbHeight:          '60px',
        toggleThumb:          true,
      });
    }

    function renderError(msg) {
      document.getElementById('grid').innerHTML = `<div class="state-message">
        <div class="icon">⊗</div>
        <h2>Could not load photos</h2>
        <p>${msg}</p>
        <p>Check that <code>mister.php</code> is uploaded alongside <code>index.html</code>.</p>
      </div>`;
    }

    // ── Boot ─────────────────────────────────────────────────
    document.getElementById('yr').textContent = new Date().getFullYear();

    (async () => {
      try {
        photos = shuffle(await fetchPhotos());
        document.getElementById('photo-count').textContent =
          `${photos.length} photo${photos.length !== 1 ? 's' : ''}`;
        buildFilters(photos);
        renderPhotos(photos);
      } catch (err) {
        console.error('Gallery error:', err);
        renderError(err.message);
      }
    })();
  </script>
</body>
</html>
